project:
  type: website

website:
  title: "Lukas Jung"
  navbar:
    right:
      - href: index.qmd
        text: About
      - href: blog/index.qmd
        text: Blog

format:
  html:
    theme: theme.scss
    css: styles.css
    include-after-body:
      text: |
        <script>
        document.addEventListener("DOMContentLoaded", function () {
          document.querySelectorAll(".navbar-nav .nav-link").forEach(function (link) {
            var href = link.getAttribute("href");
            if (!href) return;
            var linkDir = new URL(href, window.location.href).pathname.replace(/index\.html$/, "");
            if (linkDir !== "/" && window.location.pathname.indexOf(linkDir) === 0) {
              link.classList.add("active");
              link.setAttribute("aria-current", "page");
            }
          });
        });
        </script>

editor: visual
